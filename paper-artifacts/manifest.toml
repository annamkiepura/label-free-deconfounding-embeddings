# --------------------------------------------------------------------------- #
# Cohorts: a family of saved runs on identical splits, plus the seeds it
# contributes. `files` are patterns over {setting} and {encoder}; `methods` map
# a canonical method (lib/methods.py) to "<file role>:<saved condition key>".
# `patterns` resolve parameterised conditions (ranks, budgets, group counts).
# seeds = "saved" takes every seed a run saved; a list pins them (and every
# listed seed must exist, or the cell is reported missing).
# --------------------------------------------------------------------------- #
[cohorts.id]
description = "revised.run_id + revised.run_id_kmeans on the same splits (every registry seed the run saved)"
seeds = "saved"
files = { main = "id/id_{setting}_{encoder}.json", kmeans = "id/id_kmeans_{setting}_{encoder}.json" }
methods = { raw = "main:raw", pca_top1 = "main:pca_top1", kmeans_auto = "kmeans:kmeans_leace", sae_leace = "main:sae_leace", metadata_leace = "main:metadata_leace" }

[cohorts.coverage]
description = "coverage experiment at five seeds: alternatives.run_alternatives + run_kmeans_count, seeds 0-2 as published and seeds 3-4 from the seed extension (notebooks/04_extensions.ipynb Section 7), merged by focused_extensions.merge_five_seeds"
root = "results/extensions/raw/five_seeds"
seeds = [0, 1, 2, 3, 4]
files = { main = "alternatives/alternatives_{setting}_{encoder}.json", kcount = "alternatives/kmeans_count_{setting}_{encoder}.json" }
methods = { raw = "main:raw", pca_top1 = "main:pca_top1", kmeans_auto = "main:kmeans_leace", sae_leace = "main:sae_mi", metadata_leace = "main:metadata_leace", sae_random = "main:sae_random", pca_matched_var = "main:pca_matched_var", sae_recon = "main:sae_recon", sae_recon_suppressed = "main:sae_recon_suppressed" }
patterns = { "pca_top(\\d+)" = "main", "sae_mi_n(\\d+)" = "main", "sae_random_n(\\d+)" = "main", "kmeans_k(\\d+)" = "kcount" }

[cohorts.id5]
description = "revised.run_id + revised.run_id_kmeans at five seeds for the cells published with seeds 0-2: seeds 3-4 from the seed extension, merged by focused_extensions.merge_five_seeds"
root = "results/extensions/raw/five_seeds"
seeds = "saved"
files = { main = "id/id_{setting}_{encoder}.json", kmeans = "id/id_kmeans_{setting}_{encoder}.json" }
methods = { raw = "main:raw", pca_top1 = "main:pca_top1", kmeans_auto = "kmeans:kmeans_leace", sae_leace = "main:sae_leace", metadata_leace = "main:metadata_leace" }

[cohorts.encoder_study]
description = "ten-encoder study on the ORIGINAL binary SwiLTra DE/FR and SCOTUS Oyez/Lexis versions (revised.run_encoder_cell + alternatives.run_generous_k, seeds 0-2)"
seeds = [0, 1, 2]
files = { main = "encoders/encoder_{setting}_{encoder}.json", gk = "alternatives/generous_k_{setting}_{encoder}.json" }
methods = { raw = "main:raw", pca_top1 = "main:pca_top1", kmeans_auto = "gk:kmeans_auto", sae_leace = "main:sae_leace", metadata_leace = "main:metadata_leace" }
patterns = { "pca_top(\\d+)" = "main" }

[cohorts.fedlex]
description = "Fedlex notebook (notebooks/03_fedlex.ipynb, fedlex.run_primary): revised.fit_seed + evaluate_fits on outer splits by whole law, all five methods (and PCA-2) in one run, every seed it saved (0-4)"
root = "results/fedlex/raw"
seeds = "saved"
files = { main = "id/id_{setting}_{encoder}.json" }
methods = { raw = "main:raw", pca_top1 = "main:pca_top1", kmeans_auto = "main:kmeans_leace", sae_leace = "main:sae_leace", metadata_leace = "main:metadata_leace" }
patterns = { "pca_top(\\d+)" = "main" }

# --------------------------------------------------------------------------- #
# Which cohort feeds the ID exhibits (headline, composition, pair-specific
# retrieval, geometry gaps) for each setting/encoder. Unlisted -> `default`.
#
# SCOTUS / E5-small: every SCOTUS E5-small setting is covered by the final
# three-seed coverage experiment, so that cohort (seeds 0-2) is authoritative
# for all overlapping metrics. Its Raw, PCA-1, Metadata-LEACE and SAE-LEACE
# values equal run_id's seeds 0-2 exactly, and its k-means arm equals
# run_id_kmeans (checked on every build); seeds 3-4 of run_id are not used.
# The seeds were fixed by the notebooks (SWEEP_SEEDS = (0, 1, 2)) before any
# result, not chosen on results.
#
# SwiLTra and MiniLM keep the cohorts they have (not moved to three seeds):
# SwiLTra (all four settings) run_id seeds 0-4; SCOTUS/MiniLM run_id seeds 0-4;
# CAP/MiniLM run_id seeds 0-2. SemEval, CAP and Bills--Tweets E5-small use their
# run_id cohorts (SemEval/CAP 0-2, Bills--Tweets 0-4). Fedlex/E5-small uses its
# notebook's run (cohort `fedlex`, seeds 0-4), from results/fedlex/raw/.
# --------------------------------------------------------------------------- #
[assignments]
default = "id"
"semeval/e5-small" = "id5"
"cap/e5-small" = "id5"
"cap/mini" = "id5"
"scotus_oyez_lexis_wiki/e5-small" = "coverage"
"scotus_oyez_lexis/e5-small" = "coverage"
"fedlex_domestic/e5-small" = "fedlex"

# --------------------------------------------------------------------------- #
# Planned controls. Only these may render as "Pending": a cell is filled from `result_file`
# where that file exists (and passes the compatibility checks), and is Pending elsewhere.
# --------------------------------------------------------------------------- #
[pending.random_nonsae_directions]
label = "Random dir., no SAE"
status = "pending"
reason = "SAE-free random-direction control (R1): run for Main Table 3's settings by notebooks/04_extensions.ipynb Section 1 (files present); not run for other settings"
exhibits = ["tab_mechanisms", "table3_mechanism_controls"]
# Loader slot: when a run writes this file (same schema as the coverage run: per_seed[*].metrics
# [<condition>][<metric>], config.split/audit, per-seed split summaries), the row fills in from
# it, after the same seed/split/audit compatibility checks; until then it renders "Pending".
result_file = "random_directions/random_directions_{setting}_{encoder}.json"
condition = "random_dirs_n32"
