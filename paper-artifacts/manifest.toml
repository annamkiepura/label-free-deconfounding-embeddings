# Result-selection manifest for the paper's tables and figures (paper-artifacts/build.py).
#
# The cohorts point at the five-seed files that focused_extensions.merge_five_seeds writes
# (results/extensions/raw/five_seeds/: seeds 0-2 from results/main, seeds 3-4 from the seed
# extension), so the exhibit code builds the main tables and figures on seeds 0-4:
#   * cohort `coverage`: the merged alternatives and k-means-count runs, seeds 0-4;
#   * cohort `id5`: the merged run_id / run_id_kmeans files of the three cells that were run
#     with seeds 0-2 first (SemEval, CAP with E5-small and with MiniLM);
#   * SCOTUS Oyez-Wikipedia and Lexis-Wikipedia (E5-small) use their run_id cohort (seeds 0-4).
#
# This file is the single place that decides WHICH saved run feeds WHICH exhibit.
# The code in paper_assets/lib reads it; exhibits never hard-code result paths.
# Every path is relative to `results_root`, or to a cohort's own `root` (one of
# `extra_roots`). Nothing here is estimated: each
# selected cell is read seed by seed from the saved per_seed records.
#
# Edit this file (not the exhibit code) to change a result-selection decision,
# then rebuild:  python paper-artifacts/build.py

schema_version = 1
results_root = "results/main/raw"
# Result trees outside `results_root`, as repository-relative paths. A cohort with
# `root = "<one of these>"` reads its files there, and their run IDs carry the full
# path (results/fedlex/raw/...): the Fedlex notebook writes its own results tree.
extra_roots = ["results/fedlex/raw", "results/extensions/raw/five_seeds", "paper-artifacts/derived"]
# Official TACL style used for the compiled previews (unchanged copy).
tacl_style_dir = "writing/tacl_analysis_draft"
# Project code, imported only by the optional split re-derivation check
# (`python -m paper_assets validate --splits`); it loads data/ and rebuilds
# splits deterministically. No encoder, SAE, eraser, clustering or probe runs.
code_dir = "code"
# The manuscript's bibliography: dataset citation keys below must exist in it.
bibliography = "writing/tacl_analysis_draft/references.bib"
bibliography_style = "writing/tacl_analysis_draft/acl_natbib.bst"

[conventions]
# Project convention, verified against every saved aggregate on load
# (revised._stat, ood.summarize, protocols.aggregate all use ddof=1).
sd_ddof = 1
# audit.PROTOCOL["flip_adjustment"] is null in every run: AUCs are reported as
# computed (one-vs-rest mean for C > 2), never max(AUC, 1 - AUC).
auc_flip = false
# Seeds are the unit of replication. Under SemEval's 5 outer folds the
# evaluator (revised.evaluate_fits) averages fold-level AUC/purity within the
# seed and concatenates the held-out retrieval hits (and pair cosines) across
# folds, so each pair is a query once per seed. per_seed[*].metrics already
# holds that within-seed combination; folds are never treated as seeds.
fold_combination = "within-seed: mean of fold AUCs; retrieval hits pooled over folds"
# Method differences are computed per matched seed before any rounding.
difference = "paired by seed, then mean and sample SD of the per-seed differences"
display_digits = 3
# OOD intervals are the saved paired query-bootstrap intervals (conditional on the
# fitted maps). No new tests; overlapping or zero-containing intervals are never
# reported as equivalence.
ood_interval = "saved 95% paired query bootstrap, 10,000 draws, seed 0"

